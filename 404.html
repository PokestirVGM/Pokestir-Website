  <script>
    /* A /releases/<slug>/ URL with no generated page (renamed release, typo,
       or data.js edited without rerunning scripts/build-release-pages.js)
       lands here. Hand it back to the archive, which knows the catalog and
       can offer "did you mean". `missing=1` tells releases.js not to bounce
       it straight back at us. */
    (function () {
      var m = /^\/releases\/([^/]+)\/?$/.exec(window.location.pathname);
      if (m && !/\.html?$/i.test(m[1])) {
        window.location.replace('/releases/?r=' + m[1] + '&missing=1');
      }
    }());
  </script>
  <script src="/nav.js" defer></script>

    /* Same treatment as every other inline link on the site: underlined at
       rest, brightening on hover. It had no hover state at all. */
    .nf-card a {
      color: var(--white); text-decoration: underline;
      transition: color var(--mo-quick) var(--mo-out);
    }
    .nf-card a:hover { text-decoration: none; }
  </style>
