  <!-- The catalog is a serial dependency without this: the browser cannot know
       the CSV exists until it has downloaded and run gear.js, so the fetch only
       starts once the scripts have landed and the grid sits on "Loading" for a
       whole extra round trip. Declaring it here means it is discovered during
       the HTML parse and downloads alongside the CSS and JS instead of after
       them. Keep the href identical to CSV_URL in gear.js, or the browser warns
       that the preload went unused and fetches it twice. `crossorigin` is
       required for as="fetch" even same-origin; without it the preload is not
       matched and the file is downloaded twice, which was measured. -->
  <link rel="preload" as="fetch" href="./gear-software.csv" crossorigin>
  <link rel="icon" href="../images/icon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <!-- nav.js first: it defines the shared motion primitives the page scripts
       use. Deferred scripts run in document order, so this is the ordering. -->
  <script src="../nav.js" defer></script>
  <script src="gear.js" defer></script>
</head>
